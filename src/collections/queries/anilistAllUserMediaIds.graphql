query ($userName: String, $userId: Int, $statusNotIn: [MediaListStatus]) {
  anime: MediaListCollection(userName: $userName userId: $userId type: ANIME status_not_in: $statusNotIn) {
    ...mediaListCollection
  }
  manga: MediaListCollection(userName: $userName userId: $userId type: MANGA status_not_in: $statusNotIn) {
    ...mediaListCollection
  }
}

fragment mediaListCollection on MediaListCollection {
  user {
    name
    id
    avatar {
      medium
    }
  }
  lists {
    name
    entries {
      mediaId
    }
  }
}
