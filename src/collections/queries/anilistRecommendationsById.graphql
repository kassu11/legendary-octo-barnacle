query media($id: Int, $page: Int) {
  Media(id: $id) {
    id
    title {
      userPreferred
    }
    recommendations(page: $page, sort: [RATING_DESC, ID]) {
      pageInfo {
        total
        perPage
        currentPage
        lastPage
        hasNextPage
      }
      nodes {
        id
        rating
        userRating
        mediaRecommendation {
          id
          idMal
          type
          bannerImage
          averageScore
          title {
            userPreferred
          }
          mediaListEntry {
            status
          }
          startDate {
            year
          }
          status(version: 2)
          chapters
          volumes
          season
          seasonYear
          episodes
          duration
          format
          genres
          countryOfOrigin
          nextAiringEpisode {
            airingAt
            episode
          }
          coverImage {
            large
            extraLarge
            color
          }
          studios(isMain: true) {
            edges {
              isMain
              node {
                id
                name
              }
            }
          }
        }
        user {
          id
          name
          avatar {
            large
          }
        }
      }
    }
  }
}
