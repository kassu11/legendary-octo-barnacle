query ($type: MediaType, $id_in: [Int], $idMal_in: [Int]) {
  @1: Page(page: @2) {
    media(type: $type, id_in: $id_in, idMal_in: $idMal_in) {
      ...media
    }
  }
  @3
}

fragment media on Media {
  id
  idMal
  type
  bannerImage
  averageScore
  title {
    userPreferred
  }
  mediaListEntry {
    status
  }
  startDate {
    year
  }
  status(version: 2)
  chapters
  volumes
  season
  seasonYear
  episodes
  duration
  format
  genres
  countryOfOrigin
  nextAiringEpisode {
    airingAt
    episode
  }
  coverImage {
    large
    extraLarge
    color
  }
  studios(isMain: true) {
    edges {
      isMain
      node {
        id
        name
      }
    }
  }
}
