query ($slug: String!) {
  artist(slug: $slug) {
    slug
    name {
      main
    }
    images {
      nodes {
        link
        facet
      }
    }
    songStaff {
      role
      as
      alias
      song {
        id
        themes {
          slug
          type
          sequence
          group {
            name
          }
          anime {
            slug
            title {
              romaji
              english
            }
            year
            season
            format
            images {
              nodes {
                link
                facet
              }
            }
            resources {
              nodes {
                site
                externalId
              }
            }
          }
          song {
            title {
              romaji
            }
            staff {
              role
              artist {
                slug
                name {
                  main
                }
              }
            }
          }
          entries {
            version
            episodes
            spoiler
            videos {
              nodes {
                link
                resolution
                source
                nc
                tags
              }
            }
          }
        }
      }
    }
  }
}
