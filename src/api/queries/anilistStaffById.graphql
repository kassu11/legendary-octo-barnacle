query staff($id: Int) {
  Staff(id: $id) {
    id
    name {
      native
      userPreferred
      alternative
    }
    image {
      large
    }
    description
    favourites
    isFavourite
    age
    gender
    yearsActive
    homeTown
    bloodType
    dateOfBirth {
      year
      month
      day
    }
    dateOfDeath {
      year
      month
      day
    }
  }
}
